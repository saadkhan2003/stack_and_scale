name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable the locked pnpm version
        run: |
          corepack enable
          corepack install --global pnpm@11.19.0
          pnpm --version

      - run: pnpm install --frozen-lockfile
      # The workers import the public contracts/database packages. Build their
      # declaration files before type-aware ESLint resolves those package
      # exports in a clean checkout.
      - name: Build internal lint dependencies
        run: pnpm --filter @stack-and-scale/contracts build && pnpm --filter @stack-and-scale/database build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
