name: Phase 18 production baseline capture

on:
  schedule:
    # Daily UTC sample; GitHub runs scheduled workflows from the default branch.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: Capture one aggregate record or review the retained window.
        required: true
        type: choice
        default: capture
        options: [capture, review]
      reason:
        description: Approved reason for this aggregate-only capture.
        required: true
        type: choice
        options: [routine, post-release, phase-18-evidence-window]

permissions:
  contents: read

concurrency:
  group: phase18-production-baseline
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      BASELINE_ACTION: ${{ github.event_name == 'schedule' && 'capture' || inputs.action }}
      CAPTURE_REASON: ${{ github.event_name == 'schedule' && 'routine' || inputs.reason }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ env.DEPLOY_SSH_PRIVATE_KEY }}
      - run: printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
      - name: Capture and validate aggregate-only baseline
        env:
          REMOTE: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          case "$CAPTURE_REASON" in
            routine|post-release|phase-18-evidence-window) ;;
            *) echo "Unsupported capture reason." >&2; exit 64 ;;
          esac
          case "$BASELINE_ACTION" in
            capture|review) ;;
            *) echo "Unsupported baseline action." >&2; exit 64 ;;
          esac
          ssh "$REMOTE" bash -s -- "$BASELINE_ACTION" "$CAPTURE_REASON" <<'REMOTE_SCRIPT'
          set -euo pipefail
          baseline_action="$1"
          capture_reason="$2"
          cd /opt/stack-and-scale
          export IMAGE_TAG="$(sed -n 's/.*"imageTag":"\([a-f0-9]*\)".*/\1/p' deployments/current.json)"
          export IMAGE_REGISTRY="ghcr.io/saadkhan2003/stack_and_scale"
          compose=(docker compose --env-file .env.production -f infra/compose.production.yaml)
          evidence_dir="/opt/stack-and-scale/evidence/phase18/baselines"
          umask 077
          mkdir -p "$evidence_dir"

          prometheus_scalar() {
            local query="$1"
            local prometheus_container encoded_query payload
            prometheus_container="$(docker ps --filter label=com.docker.compose.service=prometheus -q | head -n 1)"
            test -n "$prometheus_container"
            encoded_query="$("${compose[@]}" exec -T api node -p 'encodeURIComponent(process.argv[1])' "$query")"
            payload="$(docker exec "$prometheus_container" wget -qO- "http://127.0.0.1:9090/api/v1/query?query=$encoded_query")"
            printf '%s' "$payload" | "${compose[@]}" exec -T api node --input-type=module -e '
              let body = "";
              for await (const chunk of process.stdin) body += chunk;
              const payload = JSON.parse(body);
              const values = payload?.data?.result;
              if (payload?.status !== "success" || !Array.isArray(values)) throw new Error("Prometheus returned an invalid response");
              const value = values.reduce((total, sample) => total + Number(sample?.value?.[1] ?? 0), 0);
              if (!Number.isFinite(value) || value < 0) throw new Error("Prometheus returned an invalid scalar");
              process.stdout.write(String(value));
            ' "$query"
          }

          case "$baseline_action" in
          capture)
          captured_at="$(date -u +%FT%TZ)"
          image_tag="$IMAGE_TAG"
          if [[ ! "$image_tag" =~ ^[a-f0-9]{7,64}$ ]]; then image_tag="unknown"; fi
          read -r load_one _ < /proc/loadavg
          cpu_count="$(getconf _NPROCESSORS_ONLN)"
          cpu_percent="$(awk -v host_load="$load_one" -v count="$cpu_count" 'BEGIN { printf "%.2f", (host_load / (count > 0 ? count : 1)) * 100 }')"
          memory_total="$(awk '/MemTotal:/ { print $2 * 1024 }' /proc/meminfo)"
          memory_available="$(awk '/MemAvailable:/ { print $2 * 1024 }' /proc/meminfo)"
          memory_used="$((memory_total - memory_available))"
          disk_used="$(df -PB1 / | awk 'NR == 2 { print $3 }')"
          disk_total="$(df -PB1 / | awk 'NR == 2 { print $2 }')"
          running_services="$("${compose[@]}" ps --status running -q | wc -l | tr -d ' ')"
          completed_requests_24h="$(prometheus_scalar 'sum(increase(stack_and_scale_api_requests_total[24h]))')"
          server_failures_24h="$(prometheus_scalar 'sum(increase(stack_and_scale_api_failures_total[24h]))')"
          average_request_duration_ms_24h="$(prometheus_scalar 'sum(increase(stack_and_scale_api_request_duration_milliseconds_total[24h])) / clamp_min(sum(increase(stack_and_scale_api_requests_total[24h])), 1)')"
          database="$("${compose[@]}" exec -T postgres sh -c 'exec psql -At -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          SELECT json_build_object(
            'connections', (SELECT count(*) FROM pg_stat_activity),
            'databaseBytes', pg_database_size(current_database()),
            'outbox', json_build_object(
              'pending', (SELECT count(*) FROM platform.outbox_events WHERE status = 'pending'),
              'processing', (SELECT count(*) FROM platform.outbox_events WHERE status = 'processing'),
              'deadLetter', (SELECT count(*) FROM platform.outbox_events WHERE status = 'dead_letter'),
              'oldestUndeliveredAgeSeconds', (
                SELECT COALESCE(
                  greatest(0, extract(epoch FROM now() - min(created_at))),
                  0
                )
                FROM platform.outbox_events
                WHERE status IN ('pending', 'processing')
              )
            ),
            'business', json_build_object(
              'leads', json_build_object(
                'created24h', (SELECT count(*) FROM platform.leads WHERE created_at >= now() - interval '24 hours'),
                'confirmedBookings24h', (SELECT count(*) FROM platform.demo_bookings WHERE status = 'confirmed' AND created_at >= now() - interval '24 hours'),
                'overdueOpenTasks', (SELECT count(*) FROM platform.lead_tasks WHERE completed_at IS NULL AND due_at IS NOT NULL AND due_at < now())
              ),
              'support', json_build_object(
                'openTickets', (SELECT count(*) FROM platform.support_tickets WHERE status NOT IN ('resolved', 'closed')),
                'unrespondedSlaBreaches', (
                  SELECT count(*)
                  FROM platform.support_tickets
                  WHERE status NOT IN ('resolved', 'closed')
                    AND first_response_at IS NULL
                    AND now() > created_at + sla_target_seconds * interval '1 second'
                )
              ),
              'integrations', json_build_object(
                'syncMutations24h', (SELECT count(*) FROM product.integration_sync_mutations WHERE created_at >= now() - interval '24 hours'),
                'conflicts24h', (SELECT count(*) FROM product.integration_conflicts WHERE created_at >= now() - interval '24 hours'),
                'pendingDeliveries', (SELECT count(*) FROM product.integration_event_deliveries WHERE status = 'pending'),
                'staleActiveInstallations', (
                  SELECT count(*)
                  FROM product.installations installation
                  WHERE installation.status = 'active'
                    AND NOT EXISTS (
                      SELECT 1
                      FROM product.installation_heartbeats heartbeat
                      WHERE heartbeat.installation_id = installation.id
                        AND heartbeat.received_at >= now() - interval '15 minutes'
                    )
                )
              )
            )
          )::text;
          SQL
          )"
          output="$evidence_dir/baseline-$(date -u +%Y%m%dT%H%M%SZ).json"
          temporary="$output.tmp"
          printf '{\n"schemaVersion":"1.2","capturedAt":"%s","imageTag":"%s","reason":"%s","host":{"cpuUtilizationPercent":%s,"memoryUsedBytes":%s,"memoryTotalBytes":%s,"diskUsedBytes":%s,"diskTotalBytes":%s,"runningServices":%s},"database":%s,"traffic":{"completedRequests24h":%s,"serverFailures24h":%s,"averageRequestDurationMilliseconds24h":%s}\n}\n' \
            "$captured_at" "$image_tag" "$capture_reason" "$cpu_percent" "$memory_used" "$memory_total" "$disk_used" "$disk_total" "$running_services" "$database" "$completed_requests_24h" "$server_failures_24h" "$average_request_duration_ms_24h" > "$temporary"

          "${compose[@]}" exec -T api node --input-type=module -e '
            let body = "";
            for await (const chunk of process.stdin) body += chunk;
            const record = JSON.parse(body);
            const top = ["schemaVersion", "capturedAt", "imageTag", "reason", "host", "database", "traffic"];
            const host = ["cpuUtilizationPercent", "memoryUsedBytes", "memoryTotalBytes", "diskUsedBytes", "diskTotalBytes", "runningServices"];
            const database = ["connections", "databaseBytes", "outbox", "business"];
            const outbox = ["pending", "processing", "deadLetter", "oldestUndeliveredAgeSeconds"];
            const business = ["leads", "support", "integrations"];
            const leads = ["created24h", "confirmedBookings24h", "overdueOpenTasks"];
            const support = ["openTickets", "unrespondedSlaBreaches"];
            const integrations = ["syncMutations24h", "conflicts24h", "pendingDeliveries", "staleActiveInstallations"];
            const traffic = ["completedRequests24h", "serverFailures24h", "averageRequestDurationMilliseconds24h"];
            const exact = (value, keys) => value && typeof value === "object" && !Array.isArray(value) && Object.keys(value).sort().join(",") === keys.sort().join(",");
            const metrics = [...host, "connections", "databaseBytes"].map((key) => key in record.host ? record.host[key] : record.database[key]).concat(Object.values(record.database.outbox ?? {}), Object.values(record.traffic ?? {}), Object.values(record.database.business?.leads ?? {}), Object.values(record.database.business?.support ?? {}), Object.values(record.database.business?.integrations ?? {}));
            if (!exact(record, top) || !exact(record.host, host) || !exact(record.database, database) || !exact(record.database.outbox, outbox) || !exact(record.database.business, business) || !exact(record.database.business.leads, leads) || !exact(record.database.business.support, support) || !exact(record.database.business.integrations, integrations) || !exact(record.traffic, traffic) || record.schemaVersion !== "1.2" || !["routine", "post-release", "phase-18-evidence-window"].includes(record.reason) || !metrics.every((value) => Number.isFinite(value) && value >= 0) || ![record.host.runningServices, record.database.connections, record.database.databaseBytes, record.database.outbox.pending, record.database.outbox.processing, record.database.outbox.deadLetter, record.traffic.completedRequests24h, record.traffic.serverFailures24h, ...Object.values(record.database.business.leads), ...Object.values(record.database.business.support), ...Object.values(record.database.business.integrations)].every(Number.isInteger)) process.exit(1);
            process.stdout.write(JSON.stringify({ capturedAt: record.capturedAt, imageTag: record.imageTag, runningServices: record.host.runningServices, databaseConnections: record.database.connections, completedRequests24h: record.traffic.completedRequests24h, outboxPending: record.database.outbox.pending }) + "\n");
          ' < "$temporary"
          mv "$temporary" "$output"
          find "$evidence_dir" -maxdepth 1 -type f -name 'baseline-*.json' -mtime +90 -delete
          test -s "$output"
          echo "Phase 18 aggregate baseline captured and validated."
          ;;
          review)
          shopt -s nullglob
          records=("$evidence_dir"/baseline-*.json)
          if [ "${#records[@]}" -eq 0 ]; then
            echo "No baseline records are available for review." >&2
            exit 1
          fi
          {
            for record in "${records[@]}"; do
              sed -n '1,$p' "$record"
              printf '\n'
            done
          } | "${compose[@]}" exec -T api node --input-type=module -e '
            let body = "";
            for await (const chunk of process.stdin) body += chunk;
            const legacyTop = ["schemaVersion", "capturedAt", "imageTag", "reason", "host", "database"];
            const extendedTop = ["schemaVersion", "capturedAt", "imageTag", "reason", "host", "database", "traffic"];
            const host = ["cpuUtilizationPercent", "memoryUsedBytes", "memoryTotalBytes", "diskUsedBytes", "diskTotalBytes", "runningServices"];
            const legacyDatabase = ["connections", "databaseBytes"];
            const extendedDatabase = ["connections", "databaseBytes", "outbox"];
            const businessDatabase = ["connections", "databaseBytes", "outbox", "business"];
            const outbox = ["pending", "processing", "deadLetter", "oldestUndeliveredAgeSeconds"];
            const business = ["leads", "support", "integrations"];
            const leads = ["created24h", "confirmedBookings24h", "overdueOpenTasks"];
            const support = ["openTickets", "unrespondedSlaBreaches"];
            const integrations = ["syncMutations24h", "conflicts24h", "pendingDeliveries", "staleActiveInstallations"];
            const traffic = ["completedRequests24h", "serverFailures24h", "averageRequestDurationMilliseconds24h"];
            const exact = (value, keys) => value && typeof value === "object" && !Array.isArray(value) && Object.keys(value).sort().join(",") === keys.sort().join(",");
            const records = body.trim().split(/\n(?=\{)/).map((line) => JSON.parse(line));
            const baseValid = (record) => ["routine", "post-release", "phase-18-evidence-window"].includes(record.reason) && Number.isFinite(Date.parse(record.capturedAt)) && exact(record.host, host) && [...host, "connections", "databaseBytes"].map((key) => key in record.host ? record.host[key] : record.database?.[key]).every((value) => Number.isFinite(value) && value >= 0) && [record.host?.runningServices, record.database?.connections, record.database?.databaseBytes].every(Number.isInteger);
            const valid = (record) => {
              if (!baseValid(record)) return false;
              if (record.schemaVersion === "1.0") return exact(record, legacyTop) && exact(record.database, legacyDatabase);
              if (record.schemaVersion === "1.1") {
                if (!exact(record, extendedTop) || !exact(record.database, extendedDatabase) || !exact(record.database.outbox, outbox) || !exact(record.traffic, traffic)) return false;
                const extra = [...Object.values(record.database.outbox), ...Object.values(record.traffic)];
                return extra.every((value) => Number.isFinite(value) && value >= 0) && [record.database.outbox.pending, record.database.outbox.processing, record.database.outbox.deadLetter, record.traffic.completedRequests24h, record.traffic.serverFailures24h].every(Number.isInteger);
              }
              if (record.schemaVersion !== "1.2" || !exact(record, extendedTop) || !exact(record.database, businessDatabase) || !exact(record.database.outbox, outbox) || !exact(record.database.business, business) || !exact(record.database.business.leads, leads) || !exact(record.database.business.support, support) || !exact(record.database.business.integrations, integrations) || !exact(record.traffic, traffic)) return false;
              const extra = [...Object.values(record.database.outbox), ...Object.values(record.traffic), ...Object.values(record.database.business.leads), ...Object.values(record.database.business.support), ...Object.values(record.database.business.integrations)];
              return extra.every((value) => Number.isFinite(value) && value >= 0) && [record.database.outbox.pending, record.database.outbox.processing, record.database.outbox.deadLetter, record.traffic.completedRequests24h, record.traffic.serverFailures24h, ...Object.values(record.database.business.leads), ...Object.values(record.database.business.support), ...Object.values(record.database.business.integrations)].every(Number.isInteger);
            };
            if (!records.length || !records.every(valid)) process.exit(1);
            const dates = [...new Set(records.map((record) => record.capturedAt.slice(0, 10)))].sort();
            const summary = { samples: records.length, distinctDays: dates.length, oldestDay: dates[0], latestDay: dates.at(-1), maturity: "ready_for_child_proposal" };
            process.stdout.write(JSON.stringify(summary) + "\n");
          '
          echo "Phase 18 aggregate baseline window reviewed."
          ;;
          esac
          REMOTE_SCRIPT
