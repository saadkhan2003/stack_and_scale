name: Build immutable delivery artifacts

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Promotion target; production requires protected-environment approval.
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: Optional safety assertion; must equal the checked-out commit SHA.
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-promote:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    env:
      # Test dependencies run on the GitHub runner before any image is built
      # or any production service is changed.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: stack_and_scale
      POSTGRES_USER: stack_and_scale
      POSTGRES_PASSWORD: local-development-only
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      REGISTRY_READ_USER: ${{ secrets.REGISTRY_READ_USER }}
      REGISTRY_READ_TOKEN: ${{ secrets.REGISTRY_READ_TOKEN }}
      # Docker registry references are lowercase. Rename the GitHub repository
      # to all lowercase before first deployment; then this follows it without
      # a second hard-coded registry name.
      IMAGE_REGISTRY: ghcr.io/${{ github.repository }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stack_and_scale
          POSTGRES_USER: stack_and_scale
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stack_and_scale -d stack_and_scale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a tag that does not match the checked-out source
        run: test -z "${{ inputs.image_tag }}" || test "${{ inputs.image_tag }}" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0 }
      - name: Enable the locked pnpm version
        run: |
          corepack enable
          corepack install --global pnpm@11.19.0
          pnpm --version
      - run: pnpm install --frozen-lockfile
      # Workspace packages publish JavaScript from dist/ in production. Build
      # them first so the API tests exercise the same import boundary as the
      # Docker runtime rather than loading TypeScript source files directly.
      - run: pnpm --filter @stack-and-scale/contracts build && pnpm --filter @stack-and-scale/database build && pnpm --filter @stack-and-scale/storage build && pnpm --filter @stack-and-scale/database migrate && pnpm --filter @stack-and-scale/api test && pnpm --filter @stack-and-scale/web build
      - uses: docker/setup-buildx-action@v3
        with:
          cleanup: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure deploy access
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ env.DEPLOY_SSH_PRIVATE_KEY }}
      - name: Pin deployment host key
        run: printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_WHATSAPP_BUSINESS_NUMBER=${{ vars.NEXT_PUBLIC_WHATSAPP_BUSINESS_NUMBER }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.cms
          push: true
          tags: ghcr.io/${{ github.repository }}/cms:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.workers
          push: true
          tags: ghcr.io/${{ github.repository }}/workers:${{ github.sha }}
      # Promotion must stop if a just-built immutable image has a known
      # critical or high vulnerability. Docker is authenticated to GHCR above.
      - name: Scan API image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Scan web image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Scan CMS image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/cms:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore
          # Payload's migration CLI executes this vendor binary only to
          # transform our trusted TypeScript configuration. It embeds an older
          # Go stdlib and is scanned separately through dependency updates;
          # do not let its embedded, non-network-facing Go CVEs mask findings
          # in the CMS application or operating system.
          skip-files: "**/node_modules/@esbuild/linux-*/bin/esbuild"
      - name: Scan workers image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/workers:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Promote only with configured protected-environment secrets
        env:
          CONFIRM_PRODUCTION_DEPLOY: ${{ github.sha }}
        run: bash scripts/deploy-promote.sh "${{ inputs.environment }}" "${{ github.sha }}"
