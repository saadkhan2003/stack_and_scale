name: Security scanning

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  filesystem:
    name: Dependency and configuration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies, infrastructure and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-filesystem.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      # Private repositories without GitHub Advanced Security cannot accept
      # SARIF results through the Code Scanning API. Keep the scan itself
      # mandatory and retain its report as a workflow artifact instead.
      - name: Retain security findings
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-sarif
          path: trivy-filesystem.sarif
          if-no-files-found: error
