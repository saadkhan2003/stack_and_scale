name: Security scanning

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  filesystem:
    name: Dependency and configuration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies, infrastructure and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-filesystem.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Upload security findings
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-filesystem.sarif
