global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    platform: stack-and-scale

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/metrics_bearer_token
    static_configs:
      - targets: [api:3100]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: containers
    static_configs:
      - targets: [cadvisor:8080]
