global:
  smtp_smarthost: smtp.resend.com:587
  smtp_from: "__TRANSACTIONAL_EMAIL_FROM__"
  smtp_auth_username: resend
  smtp_auth_password: "__RESEND_API_KEY__"
  smtp_require_tls: true

route:
  receiver: stack-and-scale-email
  group_by: [alertname, owner]
  group_wait: 30s
  group_interval: 10m
  repeat_interval: 4h

receivers:
  - name: stack-and-scale-email
    email_configs:
      - to: "__CRM_NOTIFICATION_EMAIL__"
        send_resolved: true
