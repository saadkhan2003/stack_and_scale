global:
  smtp_smarthost: smtp.resend.com:465
  smtp_from: '$TRANSACTIONAL_EMAIL_FROM'
  smtp_auth_username: resend
  smtp_auth_password: '$RESEND_API_KEY'
  smtp_require_tls: true

route:
  receiver: stack-and-scale-email
  group_by: [alertname, owner]
  group_wait: 30s
  group_interval: 10m
  repeat_interval: 4h

receivers:
  - name: stack-and-scale-email
    email_configs:
      - to: '$CRM_NOTIFICATION_EMAIL'
        send_resolved: true
