services:
  postgres:
    image: postgres:16-alpine
    container_name: stack-and-scale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stack_and_scale}
      POSTGRES_USER: ${POSTGRES_USER:-stack_and_scale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - stack-and-scale-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stack-and-scale-postgres-data:
