services:
  api:
    environment:
      METRICS_BEARER_TOKEN_FILE: /run/secrets/metrics_bearer_token
    networks: [monitoring]
    secrets:
      - source: metrics_bearer_token_api
        target: metrics_bearer_token
        uid: "10001"
        gid: "10001"
        mode: 0400

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [monitoring]
    secrets:
      - source: metrics_bearer_token_prometheus
        target: metrics_bearer_token
        uid: "65534"
        gid: "65534"
        mode: 0400
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --config.expand-env
      - --storage.path=/alertmanager
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY}
      TRANSACTIONAL_EMAIL_FROM: ${TRANSACTIONAL_EMAIL_FROM:?set TRANSACTIONAL_EMAIL_FROM}
      CRM_NOTIFICATION_EMAIL: ${CRM_NOTIFICATION_EMAIL:?set CRM_NOTIFICATION_EMAIL}
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [monitoring, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.15", memory: 128M }

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: [-config.file=/etc/loki/config.yml]
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks: [monitoring]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    command: [-config.file=/etc/promtail/config.yml]
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitoring]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.10", memory: 128M }

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://monitoring.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks: [monitoring]
    secrets: [grafana_admin_password]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/host/var/lib/stack-and-scale/monitoring
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.10", memory: 128M }

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: false
    devices:
      - source: /dev/kmsg
        target: /dev/kmsg
        permissions: r
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.20", memory: 256M }

networks:
  monitoring: { internal: true }

volumes:
  prometheus-data: {}
  alertmanager-data: {}
  loki-data: {}
  grafana-data: {}

secrets:
  metrics_bearer_token_api:
    file: ../secrets/metrics-bearer-token-api
  metrics_bearer_token_prometheus:
    file: ../secrets/metrics-bearer-token-prometheus
  grafana_admin_password:
    file: ../secrets/grafana-admin-password
