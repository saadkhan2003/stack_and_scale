<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Stack &amp; Scale Status</title>
    <style>
      body {
        background: #101114;
        color: #f5f7fa;

          16px/1.5 system-ui,
          sans-serif;
        margin: 0;
      }
      main {
        margin: 12vh auto;
        max-width: 42rem;
        padding: 2rem;
      }
      .state {
        background: #123b2b;
        border-radius: 0.5rem;
        color: #b8f5d0;
        padding: 1rem;
      }
      small {
        color: #aab1bb;
      }
    </style>

  <body>
    <main>
      <h1>Stack &amp; Scale status</h1>
      <p class="state">Status monitoring is being configured.</p>
      <p>
        This page is published separately from the application origin. Replace
        this initial message only after monitoring and an incident owner are
        active.
      </p>
      <small
        >Last reviewed: update this line whenever publishing an incident.</small
      >
    </main>
  </body>
</html>
