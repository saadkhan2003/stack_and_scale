name: stack-and-scale-production

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../secrets/cloudflare-origin.crt:/etc/caddy/origin.crt:ro
      - ../secrets/cloudflare-origin.key:/etc/caddy/origin.key:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The private Origin Certificate is intentionally mode 0600 on the host.
    # Caddy runs with no general privileges; this read-only capability is needed
    # solely to read that bind-mounted certificate and private key.
    cap_add: [NET_BIND_SERVICE, DAC_READ_SEARCH]

  web:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/web:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      SITE_URL: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      API_PUBLIC_URL: http://api:3100
      CMS_PUBLIC_URL: http://cms:3200
    networks: [edge, application]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 512M }

  api:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/api:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 20s
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      API_PORT: 3100
      API_HOST: 0.0.0.0
    # The database network is internal to this one-host Compose deployment.
    networks: [edge, application, database, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 768M }

  workers:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/workers:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    # The worker polls at most every five seconds and closes its pool on signal.
    stop_grace_period: 20s
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      WORKER_POLL_MS: 5000
    networks: [application, database, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.35", memory: 256M }

  cms:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/cms:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      PORT: 3200
    networks: [edge, application, database, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 1024M }

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    stop_grace_period: 30s
    # The image's default entrypoint is kc.sh. Replace it with a shell so the
    # realm template is rendered before Keycloak starts.
    entrypoint: ["/bin/sh", "-c"]
    # Compose otherwise splits a scalar command into words after entrypoint.
    # Keep this one shell program as the sole CMD argument for `sh -c`.
    command:
      - >-
        mkdir -p /opt/keycloak/data/import &&
        sed "s|__PUBLIC_DOMAIN__|$${PUBLIC_DOMAIN}|g"
        /opt/keycloak/realm-template/realm-stack-and-scale.production.json.tmpl
        > /opt/keycloak/data/import/realm-stack-and-scale.json &&
        exec /opt/keycloak/bin/kc.sh start --import-realm --proxy-headers=xforwarded
        --hostname-strict=true
    env_file: ../.env.production
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?set KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?set KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: identity.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    networks: [edge, application, database]
    volumes:
      - ./keycloak/realm-stack-and-scale.production.json.tmpl:/opt/keycloak/realm-template/realm-stack-and-scale.production.json.tmpl:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 768M }

  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: ../.env.production
    environment:
      POSTGRES_DB: stack_and_scale
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    # The official image starts as root solely to prepare its data/runtime
    # directories, then drops to the postgres user. Its private Docker network
    # and the absence of host-published database ports remain enforced.
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 2048M }

networks:
  edge: {}
  application: { internal: true }
  database: { internal: true }
  egress: {}

volumes:
  caddy-data: {}
  caddy-config: {}
  postgres-data: {}
