name: stack-and-scale-production

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../secrets/cloudflare-origin.crt:/etc/caddy/origin.crt:ro
      - ../secrets/cloudflare-origin.key:/etc/caddy/origin.key:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The private Origin Certificate is intentionally mode 0600 on the host.
    # Caddy runs with no general privileges; this read-only capability is needed
    # solely to read that bind-mounted certificate and private key.
    cap_add: [NET_BIND_SERVICE, DAC_READ_SEARCH]

  web:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/web:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      SITE_URL: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      API_PUBLIC_URL: http://api:3100
      CMS_PUBLIC_URL: http://cms:3200
    networks: [edge, application]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 512M }

  api:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/api:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 20s
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      API_PORT: 3100
      API_HOST: 0.0.0.0
    # The database network is internal to this one-host Compose deployment.
    networks: [edge, application, database, egress, storage]
    # Storage is an opt-in profile. Do not make the always-on API depend on
    # `minio-init`, otherwise a disabled profile prevents a normal deployment
    # from rendering or starting. The activation runbook starts and verifies
    # the profile before the S3/ClamAV environment flags are enabled.
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 768M }

  workers:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/workers:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    # The worker polls at most every five seconds and closes its pool on signal.
    stop_grace_period: 20s
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      WORKER_POLL_MS: 5000
    networks: [application, database, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.35", memory: 256M }

  cms:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/cms:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      PORT: 3200
    networks: [edge, application, database, egress, storage]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 1024M }

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    stop_grace_period: 30s
    # The image's default entrypoint is kc.sh. Replace it with a shell so the
    # realm template is rendered before Keycloak starts.
    entrypoint: ["/bin/sh", "-c"]
    # Compose otherwise splits a scalar command into words after entrypoint.
    # Keep this one shell program as the sole CMD argument for `sh -c`.
    command:
      - >-
        mkdir -p /opt/keycloak/data/import &&
        sed "s|__PUBLIC_DOMAIN__|$${PUBLIC_DOMAIN}|g"
        /opt/keycloak/realm-template/realm-stack-and-scale.production.json.tmpl
        > /opt/keycloak/data/import/realm-stack-and-scale.json &&
        exec /opt/keycloak/bin/kc.sh start --import-realm --proxy-headers=xforwarded
        --hostname-strict=true
    env_file: ../.env.production
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?set KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?set KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Caddy terminates Cloudflare Origin TLS at the edge; Keycloak receives
      # only the private HTTP hop on the Docker network.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: identity.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    networks: [edge, application, database]
    volumes:
      - ./keycloak/realm-stack-and-scale.production.json.tmpl:/opt/keycloak/realm-template/realm-stack-and-scale.production.json.tmpl:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 768M }

  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: ../.env.production
    environment:
      POSTGRES_DB: stack_and_scale
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    # The official image starts as root solely to prepare its data/runtime
    # directories, then drops to the postgres user. Its private Docker network
    # and the absence of host-published database ports remain enforced.
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 2048M }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [phase14-storage]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    volumes:
      - minio-data:/data
    networks: [storage]
    secrets:
      - source: minio_root_user
        mode: 0444
      - source: minio_root_password
        mode: 0444
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 768M }

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: [phase14-storage]
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$(cat /run/secrets/minio_root_user)"
        "$$(cat /run/secrets/minio_root_password)";
        mc mb --ignore-existing local/$${PRIVATE_STORAGE_S3_BUCKET};
        mc admin user add local "$$(cat /run/secrets/minio_api_access_key)"
        "$$(cat /run/secrets/minio_api_secret_key)" || true;
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::'
        "$${PRIVATE_STORAGE_S3_BUCKET}"'/*"]}]}' > /tmp/private-files-policy.json;
        mc admin policy create local private-files /tmp/private-files-policy.json || true;
        mc admin policy attach local private-files --user "$$(cat /run/secrets/minio_api_access_key)"
    environment:
      PRIVATE_STORAGE_S3_BUCKET: ${PRIVATE_STORAGE_S3_BUCKET:-stack-and-scale-private}
    networks: [storage]
    secrets:
      - source: minio_root_user
        mode: 0444
      - source: minio_root_password
        mode: 0444
      - source: minio_api_access_key
        mode: 0444
      - source: minio_api_secret_key
        mode: 0444
    depends_on:
      minio:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.20", memory: 128M }

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4.2}
    profiles: [phase14-storage]
    restart: unless-stopped
    # The daemon remains private; this network is only for signature updates.
    networks: [storage, egress]
    volumes:
      - clamav-database:/var/lib/clamav
    healthcheck:
      test:
        ["CMD-SHELL", "clamdscan --config-file=/etc/clamav/clamd.conf --ping 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 2048M }

  documenso:
    image: ${DOCUMENSO_IMAGE:-documenso/documenso:2.0.0}
    profiles: [documenso]
    restart: unless-stopped
    env_file: ../.env.production
    entrypoint: ["/bin/sh", "/opt/stack-and-scale/documenso-entrypoint.sh"]
    environment:
      NEXT_PUBLIC_WEBAPP_URL: https://sign.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://documenso:3000
      NEXT_PRIVATE_DATABASE_URL: ${DOCUMENSO_DATABASE_URL:-postgresql://disabled:disabled@postgres:5432/documenso}
      NEXT_PRIVATE_DIRECT_DATABASE_URL: ${DOCUMENSO_DATABASE_URL:-postgresql://disabled:disabled@postgres:5432/documenso}
      NEXT_PUBLIC_UPLOAD_TRANSPORT: database
    volumes:
      - ./documenso/entrypoint.sh:/opt/stack-and-scale/documenso-entrypoint.sh:ro
    networks: [edge, database]
    secrets:
      [
        documenso_nextauth_secret,
        documenso_encryption_key,
        documenso_encryption_secondary_key,
      ]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 1024M }

networks:
  edge: {}
  application: { internal: true }
  database: { internal: true }
  egress: {}
  storage: { internal: true }

volumes:
  caddy-data: {}
  caddy-config: {}
  postgres-data: {}
  minio-data: {}
  clamav-database: {}

secrets:
  minio_root_user:
    file: ../secrets/minio-root-user
  minio_root_password:
    file: ../secrets/minio-root-password
  minio_api_access_key:
    file: ../secrets/minio-api-access-key
  minio_api_secret_key:
    file: ../secrets/minio-api-secret-key
  documenso_nextauth_secret:
    file: ../secrets/documenso-nextauth-secret
  documenso_encryption_key:
    file: ../secrets/documenso-encryption-key
  documenso_encryption_secondary_key:
    file: ../secrets/documenso-encryption-secondary-key
