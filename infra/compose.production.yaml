name: stack-and-scale-production

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

  web:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/web:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      SITE_URL: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      API_PUBLIC_URL: http://api:3100
      CMS_PUBLIC_URL: http://cms:3200
    networks: [edge, application]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 768M }

  api:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/api:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 20s
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      API_PORT: 3100
      API_HOST: 0.0.0.0
    # Database access is over the private Hetzner network, not a misleading
    # single-host Docker network. The host firewall permits only the app node.
    networks: [edge, application, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1024M }

  workers:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/workers:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    # The worker polls at most every five seconds and closes its pool on signal.
    stop_grace_period: 20s
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      WORKER_POLL_MS: 5000
    networks: [application, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  cms:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/cms:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      PORT: 3200
    networks: [edge, application, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1024M }

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      ["/bin/sh", "-c", "sed \"s|__PUBLIC_DOMAIN__|$${PUBLIC_DOMAIN}|g\" /opt/keycloak/realm-template/realm-stack-and-scale.production.json.tmpl > /opt/keycloak/data/import/realm-stack-and-scale.json && exec /opt/keycloak/bin/kc.sh start --import-realm --proxy-headers=xforwarded --hostname-strict=true"]
    env_file: ../.env.production
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: ${PRIVATE_DATABASE_HOST:?set PRIVATE_DATABASE_HOST}
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?set KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?set KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: identity.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    networks: [edge, application]
    volumes:
      - ./keycloak/realm-stack-and-scale.production.json.tmpl:/opt/keycloak/realm-template/realm-stack-and-scale.production.json.tmpl:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1024M }

networks:
  edge: {}
  application: { internal: true }
  egress: {}

volumes:
  caddy-data: {}
  caddy-config: {}
